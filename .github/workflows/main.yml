name: Gold Macro Engine & Alerts

on:
  schedule:
    # हर 15 मिनट में रन (सोमवार से शुक्रवार)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  run-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --no-cache-dir requests pandas numpy yfinance curl_cffi

      - name: Run Engine Script
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python telegram_engine.py

      - name: Commit and Push Trade Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_log.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update trade log [skip ci]" && git push)
          
