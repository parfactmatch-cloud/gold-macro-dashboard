name: Institutional Macro & GEX Sync

on:
  schedule:
    # US Market trading hours me har ghante (Monday to Friday, 13:00 - 22:00 UTC)
    - cron: '0 13-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance scipy numpy

      - name: Run Macro & GEX Sync
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
        run: python lse_sync.py

      - name: Commit & Push Updated Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lse_macro.csv gex_levels.json || true
          git diff --staged --quiet || (git commit -m "Auto-sync LSE macro & GEX telemetry [skip ci]" && git push)
          
