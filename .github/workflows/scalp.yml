name: Gold 5M 7-EMA Scalper Engine

on:
  schedule:
    # सोमवार से शुक्रवार: हर 5 मिनट पर ऑटो-रन
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

jobs:
  scalp-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --no-cache-dir requests pandas numpy

      - name: Run Scalper Script
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scalp_engine.py

      - name: Commit and Push Scalp Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scalp_log.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scalp log [skip ci]" && git push)
          
