name: Gold Macro Engine & Alerts

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas yfinance requests

      - name: Run Macro & GEX Sync (Sends Radar Pulse)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python generate_data.py

      - name: Commit and Push Updated Cache & Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || echo "No remote changes to rebase"
          git add gex_levels.json lse_macro.csv || true
          git commit -m "auto: sync live GEX corridors and macro telemetry metrics [skip ci]" || echo "No changes to commit"
          git push origin main
          
