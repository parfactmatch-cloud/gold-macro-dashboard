name: sync-data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize sync runs: two overlapping runs both compute from the same
# HEAD and both try to push to main. The loser either fails its push or
# (with the old stash/pop dance) silently loses its state. Queuing
# instead of overlapping is the correct behaviour for a 15-minute
# state-commit loop. Do NOT use cancel-in-progress: true here — that
# would drop runs and re-introduce gaps.
concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync-data:
    runs-on: ubuntu-latest
    # A healthy run takes a few minutes now that torch is gone. If a run
    # hangs (e.g. a Yahoo call with no timeout), fail it loudly after
    # 30 minutes instead of occupying the concurrency slot for GitHub's
    # 6-hour default — a hung run would otherwise block every later run.
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # Install from the pinned requirements file only. The old step
        # installed a different, unpinned set (and torch/transformers/
        # einops that nothing imports) so the workflow environment did
        # not match a local `pip install -r requirements.txt`. Kronos is
        # a 10-bar momentum sigmoid, not a neural model — it needs no
        # torch (see kronos_gatekeeper.py).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run High-Impact Macro News Gatekeeper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python news_gatekeeper.py

      - name: Compute Live Black-Scholes GEX Levels
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python free_gex_engine.py

      - name: Run Kronos Momentum Regime Check
        # Kronos is a 10-bar momentum sigmoid, not a neural model —
        # it needs no torch/transformers (see kronos_gatekeeper.py).
        run: |
          python kronos_gatekeeper.py

      - name: Execute Jev Autonomous Paper Trading Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python jev_paper_engine.py

      - name: Run Live Institutional Radar & Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
        run: |
          python telegram_engine.py

      - name: Pull Latest Changes
        # The old step did `git stash; git pull --rebase; git stash pop`,
        # which can conflict with or discard the state files this run
        # just wrote. Stage the generated state first and let rebase
        # auto-stash it; abort cleanly instead of popping over conflicts.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gex_levels.json paper_trades.json kronos_signal.json kronos_state.json lbma_status.json news_status.json bot_control.json telegram_offset.json 2>/dev/null || true
          git -c rebase.autoStash=true pull --rebase origin main || git rebase --abort

      - name: Commit and Push Clean Telemetry
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "auto: sync live GEX, Kronos momentum, News Gatekeeper & Jev ledger"
          branch: main
          # Only the state JSONs are telemetry. Without this the action
          # also commits whatever else changed in the checkout — the
          # live history shows __pycache__/*.pyc files committed in
          # every sync commit.
          file_pattern: 'gex_levels.json paper_trades.json kronos_signal.json kronos_state.json lbma_status.json news_status.json bot_control.json telegram_offset.json'

      - name: Verify the sync landed
        # Fail loudly if this run produced no new commit: a silent
        # no-commit is how this pipeline went hours stale without
        # anyone noticing. A healthy run always changes gex_levels.json
        # (free_gex_engine.py writes a fresh timestamp_utc every run),
        # so "nothing to commit" after the scripts ran means the
        # commit/push step silently did nothing.
        run: |
          git fetch origin main
          HEAD_SHA=$(git rev-parse origin/main)
          echo "main is now at $HEAD_SHA"
          git log -1 --format='last sync commit: %h %ci %s' origin/main
          git status --short
