name: Auto-Sync Quant Terminal & Market Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-terminal:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas yfinance requests

      - name: Run GEX & Macro Data Generator Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python generate_data.py

      - name: Automatic Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: sync live GEX corridors and macro telemetry metrics [skip ci]"
          branch: main
          skip_ci: true
          # Yeh line conflict aur rejection ko rokne ke liye purane changes ko pull kar legi
          push_options: '--force'
          
