name: Auto-Sync Quant Terminal & Market Data

on:
  schedule:
    # Har 5 minute me automated sync run karega
    - cron: '*/5 * * * *'
  workflow_dispatch: # GitHub Actions tab se manual run karne ke liye

permissions:
  contents: write

jobs:
  update-terminal:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run GEX & Macro Data Generator Script
        run: |
          python generate_data.py

      - name: Commit and Push Updated Data & UI
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "auto: sync live GEX corridors and macro telemetry metrics [skip ci]"
          branch: main
          commit_options: '--no-verify'
          
